{% if articles %}<div class="journal-related-grid">{% for item in articles %}<a class="journal-related-card" href="/blog/{{ item.slug }}">{% if item.hero_image %}<img src="{{ item.hero_image }}" alt="{% firstof item.hero_image_alt item.headline %}" width="600" height="340" loading="lazy">{% else %}<div class="journal-card-placeholder"></div>{% endif %}<div><span class="journal-eyebrow">FABRYTHING JOURNAL</span><h3>{{ item.effective_headline }}</h3><p>{{ item.excerpt }}</p></div></a>{% endfor %}</div>{% else %}<p>Our first guides for this topic are on their way. <a href="/shop">Explore the shop →</a></p>{% endif %}
