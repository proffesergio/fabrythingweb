<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The mark is monochrome, so a single favicon is invisible on one theme or
         the other. Browsers that understand `media` pick the right polarity; the
         .ico is the fallback for those that don't (and for Windows pins). -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- Proves to Meta that we own fabrything.com, which is what lets the
         Facebook page / Business Suite attribute traffic and conversions to
         this domain. Meta re-checks this tag periodically: removing it silently
         un-verifies the domain, so leave it in place.
         Verify at Business Settings > Brand Safety > Domains. -->
    <meta name="facebook-domain-verification" content="8ukcq3khvo7f4a7ulli0mxo6lommla" />
    <meta
      name="description"
      content="Fabrything — online store for fashion, lifestyle, and more."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Food app display + body faces (Bricolage Grotesque / Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Fabrything</title>
    <!-- Meta Pixel. Wrapped in a hostname check so localhost/preview traffic
         never lands in the real Pixel data — otherwise every `npm start` and
         every Vercel preview build pollutes the numbers you make decisions on.
         The Pixel ID is public by design (it is readable in any page source);
         the Meta *access token* is NOT and must never appear in this repo. -->
    <script>
      (function () {
        var h = window.location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h.endsWith('.vercel.app')) return;
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '442368228898246');
        fbq('track', 'PageView');
      })();
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=442368228898246&ev=PageView&noscript=1"
      alt="" /></noscript>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
