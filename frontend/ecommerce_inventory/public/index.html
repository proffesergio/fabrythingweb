<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The mark is monochrome, so a single favicon is invisible on one theme or
         the other. Browsers that understand `media` pick the right polarity; the
         .ico is the fallback for those that don't (and for Windows pins). -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E85D4A" />
    <!-- Proves to Meta that we own fabrything.com, which is what lets the
         Facebook page / Business Suite attribute traffic and conversions to
         this domain. Meta re-checks this tag periodically: removing it silently
         un-verifies the domain, so leave it in place.
         Verify at Business Settings > Brand Safety > Domains. -->
    <meta name="facebook-domain-verification" content="8ukcq3khvo7f4a7ulli0mxo6lommla" />
    <meta
      name="description"
      content="Fabrything — online store for fashion, lifestyle, and more."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Food app display + body faces (Bricolage Grotesque / Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Fabrything</title>
    <!-- ── Google Search Console ownership ────────────────────────────
         1. Open https://search.google.com/search-console > Add property >
            fabrything.com > HTML tag method, copy the token.
         2. Set it as the Vercel env var REACT_APP_GOOGLE_SITE_VERIFICATION
            (Project > Settings > Environment Variables) and redeploy.
         CRA replaces %REACT_APP_GOOGLE_SITE_VERIFICATION% at build time.
         Until then the literal placeholder below is ignored by Google. -->
    <meta name="google-site-verification" content="%REACT_APP_GOOGLE_SITE_VERIFICATION%" />
    <!-- ── AdSense account link (needed for the AdSense site-approval check).
         Same flow: AdSense > Sites > Add site gives you a pub-ID; set
         REACT_APP_ADSENSE_CLIENT=ca-pub-XXXXXXXXXXXXXXXX in Vercel. The
         actual ad units are rendered later from the admin Traffic panel. -->
    <meta name="google-adsense-account" content="%REACT_APP_ADSENSE_CLIENT%" />
    <!-- ── Google Analytics 4 (GA4) ───────────────────────────────────
         Measurement ID G-S32TZJZCLV, overridable via Vercel env
         REACT_APP_GA4_MEASUREMENT_ID. Hostname-guarded like the Pixel below
         so localhost / *.vercel.app previews never pollute production data.
         Consent Mode v2 defaults to granted (no opt-in cookie law in BD);
         see utils/analytics.js grantConsent()/denyConsent(). -->
    <script>
      (function () {
        var h = window.location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h.endsWith('.vercel.app')) return;
        var GA_ID = '%REACT_APP_GA4_MEASUREMENT_ID%';
        if (!GA_ID || GA_ID.indexOf('REACT_APP') !== -1) GA_ID = 'G-S32TZJZCLV';
        window.__GA4_ID__ = GA_ID;
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('consent', 'default', {
          ad_storage: 'granted', ad_user_data: 'granted',
          ad_personalization: 'granted', analytics_storage: 'granted'
        });
        gtag('js', new Date());
        gtag('config', GA_ID, { send_page_view: false });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_ID);
        document.head.appendChild(s);
      })();
    </script>
    <!-- ── Google Tag Manager ─────────────────────────────────────────
         Set REACT_APP_GTM_ID=GTM-XXXXXXX in Vercel once the container exists
         (tagmanager.google.com > create container for fabrything.com).
         Empty/unset = this block no-ops. GTM then owns future tags
         (Ads conversions, extra pixels) with no redeploy needed. -->
    <script>
      (function (w, d, s, l, i) {
        if (!i || i.indexOf('REACT_APP') !== -1) return;
        var h = w.location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h.endsWith('.vercel.app')) return;
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0], j = d.createElement(s);
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + encodeURIComponent(i);
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', '%REACT_APP_GTM_ID%');
    </script>
    <!-- Meta Pixel. Wrapped in a hostname check so localhost/preview traffic
         never lands in the real Pixel data — otherwise every `npm start` and
         every Vercel preview build pollutes the numbers you make decisions on.
         The Pixel ID is public by design (it is readable in any page source);
         the Meta *access token* is NOT and must never appear in this repo. -->
    <script>
      (function () {
        var h = window.location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h.endsWith('.vercel.app')) return;
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '442368228898246');
        fbq('track', 'PageView');
      })();
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=442368228898246&ev=PageView&noscript=1"
      alt="" /></noscript>
  </head>
