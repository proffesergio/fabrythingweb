<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The mark is monochrome, so a single favicon is invisible on one theme or
         the other. Browsers that understand `media` pick the right polarity; the
         .ico is the fallback for those that don't (and for Windows pins). -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E85D4A" />
    <!-- Proves to Meta that we own fabrything.com, which is what lets the
         Facebook page / Business Suite attribute traffic and conversions to
         this domain. Meta re-checks this tag periodically: removing it silently
         un-verifies the domain, so leave it in place.
         Verify at Business Settings > Brand Safety > Domains. -->
    <meta name="facebook-domain-verification" content="8ukcq3khvo7f4a7ulli0mxo6lommla" />
    <meta
      name="description"
      content="Fabrything — online store for fashion, lifestyle, and more."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Food app display + body faces (Bricolage Grotesque / Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Fabrything</title>
    <!-- ── Google Search Console ownership ────────────────────────────
         1. Open https://search.google.com/search-console > Add property >
            fabrything.com > HTML tag method, copy the token.
         2. Set it as the Vercel env var REACT_APP_GOOGLE_SITE_VERIFICATION
            (Project > Settings > Environment Variables) and redeploy.
         CRA replaces %REACT_APP_GOOGLE_SITE_VERIFICATION% at build time.
         Until then the literal placeholder below is ignored by Google. -->
    <meta name="google-site-verification" content="%REACT_APP_GOOGLE_SITE_VERIFICATION%" />
    <!-- ── AdSense account link (needed for the AdSense site-approval check).
         Same flow: AdSense > Sites > Add site gives you a pub-ID; set
         REACT_APP_ADSENSE_CLIENT=ca-pub-XXXXXXXXXXXXXXXX in Vercel. The
         actual ad units are rendered later from the admin Traffic panel. -->
    <meta name="google-adsense-account" content="%REACT_APP_ADSENSE_CLIENT%" />
    <!-- Auto Ads is loaded only where needed by nobleseek/ads/adsConfig.js. -->
    <!-- One tracking owner: direct tags by default. Set TRACKING_MODE=gtm only
         when the published container owns all tags. The Google tag loader ID
         and the Analytics reporting destination can be different aliases. -->
    <script id="fabrything-tracking">
      (function (w, d) {
        var h = w.location.hostname;
        if (h !== 'www.fabrything.com' && h !== 'fabrything.com' && h !== 'nobleseek.fabrything.com') return;
        try { if (w.localStorage.getItem('fab_analytics_consent') === 'denied') return; }
        catch (_) { return; }
        var ga = '%REACT_APP_GA4_MEASUREMENT_ID%';
        var googleTag = '%REACT_APP_GOOGLE_TAG_ID%';
        var container = '%REACT_APP_GTM_ID%';
        var mode = '%REACT_APP_TRACKING_MODE%';
        var pixel = '%REACT_APP_META_PIXEL_ID%';
        if (!/^G-[A-Z0-9]+$/.test(ga)) ga = 'G-S32TZJZCLV';
        // The owner supplied this container's G-T4T8KFW86C installation snippet;
        // loading the old stream alias directly returns HTTP404 from Google.
        if (!/^(?:GT|G)-[A-Z0-9]+$/.test(googleTag)) googleTag = ga === 'G-S32TZJZCLV' ? 'G-T4T8KFW86C' : ga;
        if (!/^GTM-[A-Z0-9]+$/.test(container)) container = '';
        if (!/^\d{8,20}$/.test(pixel)) pixel = '442368228898246';
        w.dataLayer = w.dataLayer || [];
        function gtag() { w.dataLayer.push(arguments); }
        function load(id, src) {
          if (d.getElementById(id)) return;
          var s = d.createElement('script'); s.id = id; s.async = true; s.src = src;
          d.head.appendChild(s);
        }
        // A container can contain its own Google and Meta tags. Loading those
        // again here would count events twice and initialize unrelated pixels.
        if (mode === 'gtm' && container) {
          w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          load('fab-gtm', 'https://www.googletagmanager.com/gtm.js?id=' + encodeURIComponent(container));
          return;
        }
        if (ga) {
          w.__GA4_ID__ = ga; w.gtag = gtag;
          gtag('consent', 'default', { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted' });
          gtag('set', 'send_page_view', false);
          gtag('js', new Date());
          // Current Google tag installation endpoint; send_page_view stays off
          // because the router owns the initial and subsequent SPA pageviews.
          load('fab-ga4', 'https://www.googletagmanager.com/gtm.js?id=' + encodeURIComponent(googleTag));
        }
        if (!w.fbq) {
          var fbq = w.fbq = function () { fbq.callMethod ? fbq.callMethod.apply(fbq, arguments) : fbq.queue.push(arguments); };
          w._fbq = fbq; fbq.push = fbq; fbq.loaded = true; fbq.version = '2.0'; fbq.queue = [];
          load('fab-meta-pixel', 'https://connect.facebook.net/en_US/fbevents.js');
        }
        w.fbq('init', pixel);
        // PageView is sent by the router, once on entry and on SPA navigation.
      })(window, document);
    </script>
  <link rel="stylesheet" href="%PUBLIC_URL%/journal.css"/>
  </head>

    <div id="root"></div>
