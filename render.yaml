# Render Blueprint for the Fabrything Django API.
# Create the service from the Render dashboard: New + > Blueprint, point it at
# this repo. Secret values (marked `sync: false`) are entered in the dashboard,
# never committed here.
services:
  - type: web
    name: fabrything-api
    runtime: python
    plan: free
    rootDir: backend/EcommerceInventory
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/store/config/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random key
      - key: DEBUG
        value: "False"
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_SSLMODE
        value: require                # Neon requires SSL
      # --- Secrets / per-env values: set these in the Render dashboard ---
      - key: ALLOWED_HOSTS            # e.g. fabrything-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS     # e.g. https://fabrything.vercel.app
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_HOST
        sync: false
      # --- Object storage (Cloudflare R2 recommended, S3-compatible) ---
      # Leave all six unset to keep the DB-blob fallback. Set them (Render
      # dashboard > Environment) to route uploads to R2 — see NOBLESEEK_SETUP.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_ACESS_KEY_SECRET  # NOTE: exact misspelled name — storage.py reads it
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME  # R2: literally "auto"
        sync: false
      - key: AWS_S3_ENDPOINT_URL  # R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com (empty = AWS S3)
        sync: false
      - key: AWS_S3_PUBLIC_BASE_URL  # public host for <img> URLs, e.g. https://media.fabrything.com
        sync: false
      - key: OPENAI_API_KEY  # optional: enables AI headline/body scaffolds in Trends Inbox
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
# ── NobleSeek trends cron (2x daily BD+US pull) ──
# Render dashboard > New + > Cron Job, same repo, command below, schedule "0 6,18 * * *":
#   rootDir: backend/EcommerceInventory
#   buildCommand: "pip install -r requirements.txt"
